<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Craft - Cadastro & Consulta</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <header class="brand-header">
        <div class="brand-title">🍔 BURGER CRAFT</div>
        <div class="student-info">Gestão de Pedidos</div>
    </header>

    <div class="main-layout">
        
        <section class="card-flat">
            <h2>NOVO PEDIDO / CLIENTE</h2>

            <div id="alert-success" class="alert-success" style="display: none;">
                ✅ Cadastro realizado com sucesso!
            </div>

            <form id="form-pedido">
                <div class="form-group">
                    <label>1. Nome do Cliente:</label>
                    <input type="text" id="nome" placeholder="Ex: Carlos Silva" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>2. CEP (Preenchimento automático):</label>
                        <input type="text" id="cep" placeholder="00000-000" onblur="buscarViaCEP(this.value)" required>
                    </div>

                    <div class="form-group">
                        <label>3. Número:</label>
                        <input type="text" id="numero" placeholder="Ex: 123" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>4. Endereço:</label>
                    <input type="text" id="endereco" placeholder="Rua, Avenida, Bairro" required>
                </div>

                <div class="form-group">
                    <label>5. Telefone de Contacto:</label>
                    <input type="text" id="telefone" placeholder="(00) 90000-0000" required>
                </div>

                <div class="form-group">
                    <label>6. Observação (Detalhes do Hambúrguer):</label>
                    <textarea id="observacao" rows="3" placeholder="Ex: Ponto da carne mal passado, sem cebola, molho extra"></textarea>
                </div>

                <button type="submit" class="btn-flat">GUARDAR PEDIDO</button>
            </form>
        </section>

        <section class="card-flat">
            <h2>CONSULTA DE PEDIDOS</h2>

            <div class="search-box">
                <input type="number" id="search-id" placeholder="ID do Pedido">
                <button onclick="buscarPorId()" class="btn-small">BUSCAR</button>
                <button onclick="carregarPedidos()" class="btn-small secondary">VER TODOS</button>
            </div>

            <div id="pedidos-list" class="pedidos-container">
            </div>
        </section>

    </div>

    <script>
        const API_URL = "http://localhost:8080/api/cadastros";

        async function buscarViaCEP(cep) {
            const cepLimpo = cep.replace(/\D/g, '');
            if (cepLimpo.length === 8) {
                try {
                    const res = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
                    const data = await res.json();
                    if (!data.erro) {
                        document.getElementById("endereco").value = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
                    }
                } catch (e) {
                    console.error("Erro ao consultar ViaCEP", e);
                }
            }
        }

        document.getElementById("form-pedido").addEventListener("submit", async (e) => {
            e.preventDefault();

            const pedido = {
                nome: document.getElementById("nome").value,
                cep: document.getElementById("cep").value,
                numero: document.getElementById("numero").value,
                endereco: document.getElementById("endereco").value,
                telefone: document.getElementById("telefone").value,
                observacao: document.getElementById("observacao").value
            };

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(pedido)
            });

            if (response.ok) {
                const alertSuccess = document.getElementById("alert-success");
                alertSuccess.style.display = "block";
                document.getElementById("form-pedido").reset();
                carregarPedidos();

                setTimeout(() => alertSuccess.style.display = "none", 4000);
            }
        });

        async function carregarPedidos() {
            const res = await fetch(API_URL);
            if (res.ok) {
                const lista = await res.json();
                renderizarPedidos(lista);
            }
        }

        async function buscarPorId() {
            const id = document.getElementById("search-id").value;
            if (!id) return carregarPedidos();

            const res = await fetch(`${API_URL}/${id}`);
            if (res.ok) {
                const pedido = await res.json();
                renderizarPedidos([pedido]);
            } else {
                document.getElementById("pedidos-list").innerHTML = `<p class="empty-msg">Nenhum registo encontrado com o ID ${id}.</p>`;
            }
        }

        function renderizarPedidos(pedidos) {
            const container = document.getElementById("pedidos-list");
            container.innerHTML = "";

            if (pedidos.length === 0) {
                container.innerHTML = `<p class="empty-msg">Nenhum pedido registado.</p>`;
                return;
            }

            pedidos.forEach(p => {
                container.innerHTML += `
                    <div class="pedido-item">
                        <div class="pedido-header">
                            <span>ID #${p.id} - ${p.nome}</span>
                            <span class="badge-tel">📞 ${p.telefone}</span>
                        </div>
                        <p><strong>📍 Endereço:</strong> ${p.endereco}, Nº ${p.numero} (CEP: ${p.cep})</p>
                        <p><strong>📝 Observação:</strong> ${p.observacao || 'Sem observações.'}</p>
                    </div>
                `;
            });
        }

        carregarPedidos();
    </script>
</body>
</html>
